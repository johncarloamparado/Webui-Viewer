name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Unzip newest source zip
        run: |
          ZIP=$(for f in *.zip; do echo "${f##*_v} $f"; done | sort -V | tail -n1 | cut -d' ' -f2)
          echo "Using $ZIP"
          unzip -q -o "$ZIP" -d src
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install Gradle 8.9
        run: |
          U=https://services.gradle.org/distributions/gradle-8.9-bin.zip
          curl -fsSL "$U" -o /tmp/gradle.zip
          echo "$(curl -fsSL "$U.sha256")  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d "$HOME"
      - name: Build
        working-directory: src
        run: $HOME/gradle-8.9/bin/gradle assembleDebug --no-daemon --console=plain
      - name: Rename APK
        run: cp src/app/build/outputs/apk/debug/app-debug.apk Modora-v2.5.apk
      - uses: actions/upload-artifact@v6
        with: { name: Modora-apk, path: Modora-v2.5.apk }
